<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Items | Food Ordering</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-semibold" href="index.html">Food Ordering</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="restaurants.html">Restaurants</a></li><li class="nav-item"><a class="nav-link active" href="menu-items.html">Menu Items</a></li></ul></div></div></nav>
<main class="container py-5"><div class="page-heading"><p class="text-primary fw-semibold mb-1">MENU MANAGEMENT</p><h1 class="h2">Menu Items</h1><p class="text-secondary">Add, update, and remove menu items linked to a restaurant.</p></div>
<div class="card mb-4"><div class="card-body"><h2 class="h5 mb-3" id="form-heading">Add Menu Item</h2><form id="menu-form" class="row g-3"><input type="hidden" id="item-id">
<div class="col-md-4"><label class="form-label" for="item-name">Name</label><input class="form-control" id="item-name" required maxlength="100"></div>
<div class="col-md-3"><label class="form-label" for="item-price">Price (PKR)</label><input class="form-control" id="item-price" type="number" min="0.01" step="0.01" required></div>
<div class="col-md-3"><label class="form-label" for="item-restaurant">Restaurant</label><select class="form-select" id="item-restaurant" required><option value="">Select restaurant</option></select></div>
<div class="col-md-2 d-flex align-items-end gap-2"><button class="btn btn-primary" id="submit-item" type="submit">Add Item</button><button class="btn btn-outline-secondary" id="cancel-edit" type="button" hidden>Cancel</button></div></form><div id="menu-message" hidden></div></div></div>
<div class="card"><div class="card-body"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">All Menu Items</h2><button class="btn btn-sm btn-outline-secondary" id="refresh-items">Refresh</button></div><div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Restaurant</th><th>Actions</th></tr></thead><tbody id="menu-list"></tbody></table></div></div></div>
</main><script src="shared.js"></script><script src="menu-items.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
