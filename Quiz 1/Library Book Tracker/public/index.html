<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="#">Library Book Tracker</a></div></nav>
  <main class="container py-4">
    <h1 class="h3 mb-3">Add Book</h1>
    <form id="book-form" class="row g-3">
      <div class="col-md-6"><label class="form-label" for="title">Title</label><input class="form-control" id="title" required></div>
      <div class="col-md-6"><label class="form-label" for="author">Author</label><input class="form-control" id="author" required></div>
      <div class="col-md-6"><label class="form-label" for="category">Category</label><input class="form-control" id="category" required></div>
      <div class="col-md-6"><label class="form-label" for="year">Year</label><input class="form-control" id="year" required></div>
      <div class="col-12"><button class="btn btn-primary" type="submit">Add Book</button></div>
      <p id="message" class="text-danger mb-0" role="status"></p>
    </form>
    <hr class="my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h2 class="h4 mb-0">Books</h2>
      <select id="category-filter" class="form-select filter-select" aria-label="Filter by category"><option value="all">All categories</option></select>
    </div>
    <div id="book-list" class="row g-3"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
