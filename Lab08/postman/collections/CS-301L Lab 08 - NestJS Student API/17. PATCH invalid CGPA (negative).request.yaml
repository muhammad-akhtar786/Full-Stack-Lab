$kind: http-request
url: "{{baseUrl}}/api/students/{{newRoll}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cgpa": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 (Bad Request)", function () { pm.response.to.have.status(400); });
      pm.test("Error is Validation failed", function () { pm.expect(pm.response.json().error).to.eql("Validation failed"); });
      pm.test("Details mention: cgpa must not be greater than 4", function () {
        pm.expect(pm.response.json().details.join(" | ")).to.include("cgpa must not be greater than 4");
      });
    language: text/javascript
order: 17000
