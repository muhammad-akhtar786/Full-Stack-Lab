$kind: http-request
url: "{{baseUrl}}/api/students/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 (Bad Request)", function () { pm.response.to.have.status(400); });
      pm.test("Details mention: rollNumber must look like BSCS-001", function () {
        pm.expect(pm.response.json().details.join(" | ")).to.include("rollNumber must look like BSCS-001");
      });
    language: text/javascript
order: 6000
