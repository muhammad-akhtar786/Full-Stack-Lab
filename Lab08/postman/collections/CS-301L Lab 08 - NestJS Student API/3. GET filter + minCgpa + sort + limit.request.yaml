$kind: http-request
url: "{{baseUrl}}/api/students?department=Data Science&minCgpa=1&sort=cgpa&order=desc&limit=1"
method: GET
queryParams:
  department: Data Science
  minCgpa: "1"
  sort: cgpa
  order: desc
  limit: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 (OK)", function () { pm.response.to.have.status(200); });
      pm.test("Only the best Data Science student is returned", function () {
        const d = pm.response.json();
        pm.expect(d.length).to.eql(1);
        pm.expect(d[0].rollNumber).to.eql("BSCS-050");
      });
    language: text/javascript
order: 3000
