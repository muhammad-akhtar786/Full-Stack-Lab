$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Al",
      "rollNumber": "X1",
      "email": "nope",
      "department": "Art",
      "semester": 12,
      "cgpa": 9
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 (Bad Request)", function () { pm.response.to.have.status(400); });
      pm.test("Error is Validation failed", function () { pm.expect(pm.response.json().error).to.eql("Validation failed"); });
      pm.test("Every invalid field is reported", function () { pm.expect(pm.response.json().details.length).to.be.at.least(6); });
    language: text/javascript
order: 11000
