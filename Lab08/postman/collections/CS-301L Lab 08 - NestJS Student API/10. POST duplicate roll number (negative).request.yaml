$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "  Zara Ali ",
      "rollNumber": "bscs-099",
      "email": "Zara@Example.com",
      "department": "Data Science",
      "semester": 3,
      "cgpa": 3.25
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409 (Conflict)", function () { pm.response.to.have.status(409); });
      pm.test("Error mentions the roll number", function () { pm.expect(pm.response.json().message).to.include("BSCS-099"); });
    language: text/javascript
order: 10000
